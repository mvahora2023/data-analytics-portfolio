name: SQL portfolio static checks
on:
  push:
    branches: [master]
    paths: ['schema/**', 'queries/**', 'tests/**', '.github/workflows/validate-sql.yml']
  pull_request:
    paths: ['schema/**', 'queries/**', 'tests/**', '.github/workflows/validate-sql.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
